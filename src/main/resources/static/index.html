<html>
<head>
    <title>Joy</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=2">
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/joy.js"></script>

    <link rel=icon href=/favicon.ico>

    <style>
        *
        #joystick1
        {
            border: 1px solid #FF0000;
        }
        #joystick2
        {
            border: 1px solid #0000FF;
        }
    </style>
</head>
<body>
<!--https://codepen.io/dev357/pen/QwLgde-->


<div class="container text-center">
    <div class="row">
        <div class="col">
            <div id="joy1Div" style="width:150px;height:150px;margin:50px"></div>
            X :<input id="joy1X" type="text"/></br>
            Y :<input id="joy1Y" type="text"/>
        </div>
        <div class="col">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">First</th>
                    <th scope="col">Last</th>
                    <th scope="col">Handle</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>@mdo</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Jacob</td>
                    <td>Thornton</td>
                    <td>@fat</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td colspan="2">Larry the Bird</td>
                    <td>@twitter</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col">
            <div id="joy2Div" style="width:150px;height:150px;margin:50px"></div>
            X :<input id="joy2X" type="text"/></br>
            Y :<input id="joy2Y" type="text"/>
        </div>
    </div>
</div>

<script type="text/javascript">
    // Create JoyStick object into the DIV 'joy1Div'
	var joy1Param = { "title": "joystick1", "autoReturnToCenter": true };
	var Joy1 = new JoyStick('joy1Div', joy1Param);

    var joy1X = document.getElementById("joy1X");
    var joy1Y = document.getElementById("joy1Y");

	var joy2Param = { "title": "joystick2", "autoReturnToCenter": true };
	var Joy2 = new JoyStick('joy2Div', joy2Param);

	var joy2X = document.getElementById("joy2X");
	var joy2Y = document.getElementById("joy2Y");

    const url = 'http://localhost:8080/api/position';

    setInterval(function(){
        let leftJoyX=Joy1.GetX();
        let leftJoyY=Joy1.GetY();
        let rightJoyX=Joy2.GetX();
        let rightJoyY=Joy2.GetY();

        joy1X.value=leftJoyX;
        joy1Y.value=leftJoyY;
        joy2X.value=rightJoyX;
        joy2Y.value=rightJoyY;
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                    leftJoyX: leftJoyX,
                    leftJoyY: leftJoyY,
                    rightJoyX: rightJoyX,
                    rightJoyY: rightJoyY
                })
        })
        .then(response => response)
        .then(data => {
            console.log('Успех:', data);
        })
        .catch((error) => {
            console.log('error:', error);
<!--            let problem = confirm("check connection");-->
<!--            alert( problem );-->
        });
    }, 200);

</script>
</body>
</html>
